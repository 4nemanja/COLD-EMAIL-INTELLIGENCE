<style>
:root {
  --bg: #FCFCFD;
  --fg: #0F2650;
  --line: rgba(15,38,80,0.10);
  --line2: rgba(15,38,80,0.07);
  --dim: #5a6b86;
  --dim2: #9aa6ba;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ambient light */
.aura { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.aura::before,
.aura::after { content: ''; position: absolute; border-radius: 50%; }
.aura::before {
  width: 1100px; height: 1100px; top: -660px; left: 50%; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(46,123,246,0.10) 0%, transparent 62%);
}
.aura::after {
  width: 880px; height: 880px; bottom: -580px; left: 4%;
  background: radial-gradient(circle, rgba(255,99,73,0.09) 0%, transparent 64%);
}

/* grain */
body::after {
  content: ''; position: fixed; inset: 0; z-index: 60; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.028;
}

.wrap { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; }

/* ─── BAR ─── */
.bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 26px 56px;
  border-bottom: 1px solid var(--line2);
}
.logo {
  font-weight: 800; font-size: 18px; letter-spacing: 0.26em;
  color: var(--fg); text-decoration: none;
}
.logo i { font-style: normal; color: #FF6349; }
.portal {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--dim2); text-decoration: none; transition: color 0.25s;
}
.portal:hover { color: var(--fg); }

/* ─── STAGE ─── */
main {
  flex: 1;
  display: flex; flex-direction: column; justify-content: center;
  padding: 48px 56px;
}

.kicker {
  font-size: 10px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--dim2); text-align: center; margin-bottom: 34px;
  opacity: 0; animation: rise 0.8s ease forwards;
}

.grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 18px; width: 100%; max-width: 1080px; margin: 0 auto;
}

.card {
  position: relative; overflow: hidden;
  display: block;
  padding: 24px 26px 22px;
  text-decoration: none; color: var(--fg);
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 1px 2px rgba(15,38,80,0.04), 0 18px 34px -30px rgba(15,38,80,0.55);
  transition: transform 0.4s cubic-bezier(.2,.7,.3,1), border-color 0.4s, box-shadow 0.4s;
  opacity: 0; animation: rise 0.85s cubic-bezier(.2,.7,.3,1) forwards;
}
.card:nth-child(1) { animation-delay: 0.06s; }
.card:nth-child(2) { animation-delay: 0.13s; }
.card:nth-child(3) { animation-delay: 0.2s; }

.card::before {
  content: ''; position: absolute; z-index: 0; pointer-events: none;
  top: -150px; right: -110px; width: 300px; height: 300px;
  background: radial-gradient(circle, var(--c) 0%, transparent 65%);
  opacity: 0.1; transition: opacity 0.5s;
}
.card > * { position: relative; z-index: 1; }

.card:hover {
  transform: translateY(-4px);
  border-color: var(--c-line);
  box-shadow: 0 1px 2px rgba(15,38,80,0.04), 0 28px 48px -30px rgba(15,38,80,0.5);
}
.card:hover::before { opacity: 0.22; }

.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.num { font-size: 10.5px; font-weight: 700; letter-spacing: 0.2em; color: var(--dim2); }
.ico {
  width: 20px; height: 20px; stroke: var(--c); fill: none;
  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  opacity: 0.8; transition: opacity 0.4s;
}
.card:hover .ico { opacity: 1; }

.tag {
  font-size: 9.5px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--c-deep); margin-bottom: 9px;
}
.card h2 {
  font-size: clamp(20px, 1.6vw, 24px);
  font-weight: 800; letter-spacing: -0.03em; line-height: 1.1;
}
.note { font-size: 13px; color: var(--dim); margin-top: 8px; }

.rule { height: 1px; background: var(--line2); margin: 18px 0 14px; }

.go {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--dim2); transition: color 0.35s;
}
.card:hover .go { color: var(--fg); }
.arrow {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.35s, border-color 0.35s, transform 0.35s, color 0.35s;
}
.arrow svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.card:hover .arrow { background: var(--c); border-color: var(--c); color: #ffffff; transform: translateX(3px); }

/* ─── FOOT ─── */
footer {
  padding: 20px 56px;
  border-top: 1px solid var(--line2);
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--dim2);
}
footer a { color: var(--dim2); text-decoration: none; transition: color 0.25s; }
footer a:hover { color: var(--fg); }
.f-links { display: flex; gap: 26px; list-style: none; }

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── RESPONSIVE ─── */
@media (max-width: 1080px) {
  .bar, footer { padding-left: 30px; padding-right: 30px; }
  main { padding: 40px 30px; }
  .grid { grid-template-columns: 1fr; max-width: 460px; gap: 14px; }
  .kicker { margin-bottom: 26px; }
  .head { margin-bottom: 16px; }
}
@media (max-width: 600px) {
  .bar { padding: 20px 22px; }
  main { padding: 30px 22px; }
  footer { padding: 18px 22px; flex-direction: column; gap: 10px; }
  .logo { font-size: 16px; letter-spacing: 0.22em; }
  .f-links { gap: 18px; }
}

a:focus-visible { outline: 1px solid var(--c, #FF6349); outline-offset: 4px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  .card, .kicker { opacity: 1; }
}
</style>
